name: US Automated ORB Session

on:
  schedule:
    # 15:15 UTC = 11:15 PM AWST (Standard Time - 45m after 9:30 AM EST Open)
    - cron: '15 15 * * 1-5'
    # 21:05 UTC = 05:05 AM AWST (Market Close Recap)
    - cron: '5 21 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose job to run'
        required: true
        default: 'trade'
        type: choice
        options:
          - trade
          - recap

concurrency:
  group: us-orb-session-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Needs explicit permissions to push the Excel file back to the repository
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Script
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APCA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY }}
          APCA_API_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "recap" ] || [ "$(date -u +%H)" = "21" ]; then
            python eod_flatten.py || true
            python eod_recap.py
          else
            python bot.py
          fi
          
      - name: Save Excel Journal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "Trading Journal.xlsx"
          git commit -m "Auto-update Trading Journal" || echo "No changes to commit"
          git push
