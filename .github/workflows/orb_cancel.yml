name: US ORB - expire entries

on:
  schedule:
    # staggered; early runs wait for 11:30 ET
    - cron: '0 15 * * 1-5'
    - cron: '31 15 * * 1-5'
    - cron: '0 16 * * 1-5'
    - cron: '31 16 * * 1-5'
  workflow_dispatch:

concurrency:
  group: orb-cancel
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 160
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
        run: python bot.py cancel
