name: US ORB - EOD flatten + recap

on:
  schedule:
    # staggered from ~13:35 ET; waits in-job until 15:50 ET when a position is open
    - cron: '35 18 * * 1-5'
    - cron: '5 19 * * 1-5'
    - cron: '5 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: orb-eod
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 170
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - id: d
        run: echo "day=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore once-per-day recap marker
        uses: actions/cache/restore@v4
        with:
          path: .eod_marker
          key: orb-eod-${{ steps.d.outputs.day }}
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
          EOD_MARKER: .eod_marker
        run: python bot.py eod
      - name: Save recap marker
        if: always() && hashFiles('.eod_marker') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .eod_marker
          key: orb-eod-${{ steps.d.outputs.day }}
