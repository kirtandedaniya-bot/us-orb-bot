name: US ORB - EOD flatten + recap

on:
  schedule:
    # ~15:05 ET; bot waits in-job until 15:50 ET (absorbs GitHub schedule delays)
    - cron: '5 19 * * 1-5'
    - cron: '5 20 * * 1-5'
  workflow_dispatch:

concurrency:
  group: orb-eod
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
        run: python bot.py eod
