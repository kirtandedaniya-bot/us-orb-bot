name: Research - fetch stocks-in-play dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install alpaca-py pandas pyarrow numpy
      - name: Download bars
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python research/fetch_sip.py /tmp/data
      - name: Publish to orphan branch "data-sip"
        run: |
          cd /tmp/data
          rm -f daily.parquet first5.parquet   # >100MB; backtest only needs selected.csv + intraday_*
          ls -la
          git init -q -b data-sip
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "stocks-in-play dataset $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-sip
