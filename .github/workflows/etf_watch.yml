name: ETF momentum - daily crash watch (read-only)

on:
  schedule:
    - cron: '30 21 * * 1-5'   # ~16:30 ET (EST) / 17:30 ET (EDT), after the close
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Watch
        env:
          ETF_ALPACA_API_KEY: ${{ secrets.ETF_ALPACA_API_KEY }}
          ETF_ALPACA_SECRET_KEY: ${{ secrets.ETF_ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python etf_watch.py
