name: US ORB - on-demand recap (read-only)

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'NY date YYYY-MM-DD (blank = today)'
        required: false
        default: ''

jobs:
  run:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py report ${{ inputs.day }}
