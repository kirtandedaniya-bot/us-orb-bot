name: US ORB - entries

on:
  schedule:
    # 4 staggered crons (08:00-09:30 ET in winter, 09:00-10:30 in summer); first to arrive sleeps to 10:15, rest are idempotent
    - cron: '0 13 * * 1-5'
    - cron: '30 13 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: orb-trade
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
          MAX_DRAWDOWN_USD: ${{ vars.MAX_DRAWDOWN_USD || '3800' }}
        run: python bot.py trade
