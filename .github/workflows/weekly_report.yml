name: Weekly report (all bots, read-only)

on:
  schedule:
    - cron: '0 23 * * 6'    # Sunday 07:00 Perth
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Report
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ETF_ALPACA_API_KEY: ${{ secrets.ETF_ALPACA_API_KEY }}
          ETF_ALPACA_SECRET_KEY: ${{ secrets.ETF_ALPACA_SECRET_KEY }}
          RSI2_ALPACA_API_KEY: ${{ secrets.RSI2_ALPACA_API_KEY }}
          RSI2_ALPACA_SECRET_KEY: ${{ secrets.RSI2_ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python weekly_report.py
